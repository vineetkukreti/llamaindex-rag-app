<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }

    header { background: #1a1a2e; color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 18px; font-weight: 600; }

    .upload-btn { position: relative; background: #16213e; color: #fff; border: 1px solid #0f3460; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .upload-btn:hover { background: #0f3460; }
    .upload-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    .chat-area { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

    .msg { max-width: 720px; width: 100%; margin: 0 auto; padding: 14px 18px; border-radius: 10px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { background: #1a1a2e; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.bot { background: #fff; color: #1a1a2e; border: 1px solid #e0e0e0; border-bottom-left-radius: 2px; }
    .msg.system { background: #e8f5e9; color: #2e7d32; text-align: center; font-size: 13px; max-width: 480px; }
    .msg.error { background: #fce4ec; color: #c62828; text-align: center; font-size: 13px; max-width: 480px; }

    .sources { margin-top: 12px; padding-top: 10px; border-top: 1px solid #eee; font-size: 12px; color: #666; }
    .sources summary { cursor: pointer; font-weight: 500; color: #444; }
    .source-item { margin-top: 8px; padding: 8px; background: #f9f9f9; border-radius: 4px; }

    .typing { display: flex; gap: 4px; padding: 14px 18px; }
    .typing span { width: 8px; height: 8px; background: #aaa; border-radius: 50%; animation: bounce 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }

    .input-bar { background: #fff; border-top: 1px solid #e0e0e0; padding: 16px 24px; display: flex; gap: 12px; max-width: 780px; width: 100%; margin: 0 auto; }
    .input-bar input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
    .input-bar input:focus { border-color: #1a1a2e; }
    .input-bar button { background: #1a1a2e; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .input-bar button:hover { background: #16213e; }
    .input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>RAG Chat</h1>
    <label class="upload-btn">
      Upload Files
      <input type="file" id="fileInput" multiple accept=".pdf,.txt,.md" />
    </label>
  </header>

  <div class="chat-area" id="chat">
    <div class="msg system">Upload documents and ask questions about them.</div>
  </div>

  <div class="input-bar">
    <input type="text" id="questionInput" placeholder="Ask a question..." />
    <button id="sendBtn" onclick="askQuestion()">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const questionInput = document.getElementById('questionInput');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');

    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !sendBtn.disabled) askQuestion();
    });

    fileInput.addEventListener('change', uploadFiles);

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = `msg ${cls}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'msg bot typing';
      div.id = 'typing';
      div.innerHTML = '<span></span><span></span><span></span>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    async function uploadFiles() {
      const files = fileInput.files;
      if (!files.length) return;

      const names = Array.from(files).map(f => f.name).join(', ');
      addMsg(`Uploading: ${names}`, 'system');

      const formData = new FormData();
      for (const f of files) formData.append('files', f);

      try {
        const res = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (res.ok) {
          addMsg(data.message, 'system');
        } else {
          addMsg(data.detail || 'Upload failed.', 'error');
        }
      } catch {
        addMsg('Upload failed. Is the server running?', 'error');
      }

      fileInput.value = '';
    }

    async function askQuestion() {
      const question = questionInput.value.trim();
      if (!question) return;

      addMsg(question, 'user');
      questionInput.value = '';
      sendBtn.disabled = true;
      showTyping();

      try {
        const res = await fetch('/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        removeTyping();
        const data = await res.json();

        if (res.ok) {
          const botDiv = addMsg(data.answer, 'bot');

          if (data.sources && data.sources.length) {
            const details = document.createElement('details');
            details.className = 'sources';
            let html = `<summary>Sources (${data.sources.length})</summary>`;
            for (const s of data.sources) {
              const name = s.metadata?.file_name || 'unknown';
              const score = s.score != null ? ` — score: ${s.score}` : '';
              html += `<div class="source-item"><strong>${name}${score}</strong><br/>${s.text}</div>`;
            }
            details.innerHTML = html;
            botDiv.appendChild(details);
          }
        } else {
          addMsg(data.detail || 'Something went wrong.', 'error');
        }
      } catch {
        removeTyping();
        addMsg('Request failed. Is the server running?', 'error');
      }

      sendBtn.disabled = false;
      questionInput.focus();
    }
  </script>
</body>
</html>
